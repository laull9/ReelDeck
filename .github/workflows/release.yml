name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 GitHub Release（关闭时只生成 artifacts）'
        type: boolean
        default: false
      tag_name:
        description: '发布标签，必须已存在且指向本次构建提交'
        default: ''
      draft:
        description: '草稿发布'
        type: boolean
        default: true
      prerelease:
        description: '预发布'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: reeldeck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Validate version and release target
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          PUBLISH: ${{ inputs.publish_release }}
        run: python3 scripts/ci_version.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 scripts/generate_icons.py --check
      - run: python3 -m unittest discover -s test/scripts -v

  build-windows:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup native Flutter SDK
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP/flutter"
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE) { throw 'Flutter clone failed' }
          "$sdk/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$sdk/bin/flutter.bat" --version
          if ($LASTEXITCODE) { throw 'Flutter bootstrap failed' }
          $dartVersion = & "$sdk/bin/cache/dart-sdk/bin/dart.exe" --version 2>&1
          Write-Output $dartVersion
          if ($dartVersion -notmatch 'windows_${{ matrix.arch }}') { throw 'Dart SDK architecture does not match target' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install ARM64 C++ toolchain
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installed = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (!$installed) {
            $path = & $vswhere -latest -products '*' -property installationPath
            $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vs_installer.exe"
            $process = Start-Process $installer -ArgumentList "modify --installPath `"$path`" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart" -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw 'ARM64 toolchain installation failed' }
          }
      - uses: actions/cache@v4
        if: matrix.arch == 'arm64'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: angle-arm64-eb2d3a3279fd019cb7733072d86900d0ad2a1aef
      - name: Build ARM64 ANGLE
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: ./scripts/prepare_windows_arm64.ps1
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - name: Verify and package Windows
        shell: pwsh
        run: |
          $bundle = 'build/windows/${{ matrix.arch }}/runner/Release'
          python scripts/verify_arch.py $bundle '${{ matrix.arch }}'
          if ($LASTEXITCODE) { throw 'Binary architecture check failed' }
          foreach ($name in @('reel_deck.exe', 'flutter_windows.dll', 'libmpv-2.dll', 'libEGL.dll', 'libGLESv2.dll', 'data/flutter_assets')) {
            if (!(Test-Path "$bundle/$name")) { throw "Missing runtime: $name" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dist/ReelDeck-windows-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-linux:
    if: github.event_name != 'pull_request'
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libepoxy-dev liblzma-dev rpm desktop-file-utils xvfb
      - name: Setup Flutter on native architecture
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --no-pub --target-platform linux-${{ matrix.arch }}
      - name: Verify Linux runtime
        run: |
          python3 scripts/verify_arch.py build/linux/${{ matrix.arch }}/release/bundle ${{ matrix.arch }}
          ldd build/linux/${{ matrix.arch }}/release/bundle/reel_deck | tee /tmp/reeldeck-ldd.txt
          if grep -q 'not found' /tmp/reeldeck-ldd.txt; then exit 1; fi
      - name: Package deb and rpm
        run: python3 scripts/package_linux.py --bundle build/linux/${{ matrix.arch }}/release/bundle --arch ${{ matrix.arch }} --version '${{ needs.verify.outputs.version }}'
      - name: Validate deb installation and launch
        run: |
          sudo apt-get install -y ./dist/ReelDeck-linux-${{ matrix.arch }}.deb
          set +e
          timeout 10s xvfb-run -a /usr/lib/reeldeck/reel_deck > /tmp/reeldeck-startup.log 2>&1
          status=$?
          set -e
          cat /tmp/reeldeck-startup.log
          test "$status" = 124
          if grep -Eqi 'cannot find libmpv|symbol lookup error|error while loading shared libraries|Segmentation fault' /tmp/reeldeck-startup.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    if: github.event_name != 'pull_request'
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - if: matrix.arch == 'arm64'
        run: flutter config --enable-macos-arm64-only
      - run: flutter build macos --release --no-pub
      - name: Thin, verify and package macOS
        run: python3 scripts/package_macos.py --app build/macos/Build/Products/Release/ReelDeck.app --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-android:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure optional release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android_signing.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64
      - name: Verify APK ABIs and package
        run: python3 scripts/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
    needs: [verify, build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Ensure complete artifact set and checksums
        run: |
          test "$(find dist -type f | wc -l)" -eq 10
          cd dist
          sha256sum ReelDeck-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ReelDeck ${{ needs.verify.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
