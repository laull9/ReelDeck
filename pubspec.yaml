name: reel_deck
description: "Pick a folder. Shuffle. Swipe."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # 播放器
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_android_video: ^1.3.6

  # 数据库
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28

  # 状态管理
  provider: ^6.1.2

  # 路径
  path_provider: ^2.1.5
  path: ^1.9.1

  # 文件选择
  file_picker: ^8.1.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift 代码生成
  drift_dev: ^2.23.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
